# Talos settings.
#
# Copy any section into config/local.toml to override it without touching this
# file — local.toml is git-ignored and takes precedence key by key, so it only
# needs the values you actually want to change.

[assistant]
name = "Talos"
character_file = "config/character.md"
# Turns of conversation kept in context. Each turn is a user message plus a
# reply; the character definition is always present on top of these.
history_turns = 6
# Write every exchange to data/memory.db so it can be recalled later. The file
# is git-ignored and never leaves the machine; delete it to forget everything.
remember = true
# When exchanges fall out of the window above, condense them into a running
# note instead of discarding them. Without this a long conversation forgets its
# own beginning without saying so, and answers confidently about a subject it
# can no longer see. Costs one extra model call whenever the window overflows.
summarise = true
# Hard ceiling on those notes, in characters. Asked to keep everything and stay
# brief, a summariser reliably picks "keep everything" — the note grows by a
# clause each time and eventually crowds out the conversation it supports. Over
# this, it gets compressed again.
summary_chars = 600

[audio]
# 16 kHz because Whisper resamples to it anyway. Recording here avoids a
# conversion on every utterance.
sample_rate = 16000
# Held down to talk. Released to send.
hotkey = "f9"
# Recording shorter than this is treated as a misfire rather than speech.
min_seconds = 0.4
# Anything below this peak amplitude is silence, and skips the whole chain.
silence_threshold = 0.01
# Which microphone and speaker to use. Empty follows the Windows default, so
# the assistant moves with your headset. Pin one by index or by any part of its
# name when the default is not the one you want:
#   input_device = "Realtek"
#   output_device = 5
# See the list with:  run main.py --devices
input_device = ""
output_device = ""

[wake]
# Talos wakes when a transcribed utterance starts with its name. There is no
# wake-word model to train: voice activity detection finds speech, Whisper
# reads it, and the name is matched as a word rather than as a sound.
word = "Talos"
# Silero's speech probability above which a chunk counts as speech. Raise it in
# a noisy room, lower it if quiet speech is being missed.
speech_threshold = 0.5
# Silence that means the sentence ended rather than a pause for breath. Too
# short cuts you off mid-thought; too long makes every reply feel late.
silence_seconds = 0.8
# Shorter than this is a cough, a door, a chair.
min_seconds = 0.5
# Cap so one long monologue cannot stall the listener.
max_seconds = 15.0
# People say the name, pause, and then ask. After a bare "Talos" the next
# utterance is taken as the command without repeating the name, for this long.
follow_up_seconds = 8.0
# The same again after Talos answers, so a reply ending in a question can just
# be answered. This is the setting that decides whether talking to Talos feels
# like a conversation or like a series of commands.
#
# It is also the one that costs you. For this long after every answer, anything
# said in the room is treated as addressed to Talos — and with speaker
# verification out of scope, there is nothing to tell your voice from the
# television's. Set to 0 to require the name every time.
continue_seconds = 10.0
# Said out loud when the name is heard on its own. Without it there is no way
# to tell the difference between listening and not having heard.
acknowledgement = "Yes?"
# Microphone input is discarded for this long after Talos stops speaking. Its
# own voice is still travelling to the microphone when playback ends, and
# arrives as a short utterance that transcribes to nothing. Raise it if you use
# loud speakers close to the microphone.
settle_seconds = 0.25

[stt]
model = "large-v3-turbo"
# Whisper is stronger in English than in any other language, and pinning it
# rather than auto-detecting saves a detection pass on every utterance.
language = "en"
# Words to expect. Whisper is reliable on ordinary English and unreliable on
# jargon — it heard "serialization" as "sterilization" — and a decoder told to
# expect a word gets it right far more often than any correction afterwards.
# Keep the list short: it is a hint, and a long one dilutes itself.
vocabulary = [
    "serialization", "deserialization", "Blazor", "ASP.NET", "NuGet",
    "BACnet", "SQLite", "async", "refactor", "endpoint", "middleware",
    "repository", "migration", "Whisper", "Ollama", "Piper",
]
# Project folder names are added automatically, so your own repositories are
# transcribed as themselves rather than as whatever English word they resemble.
include_project_names = true
# Greedy decoding. Measurably faster, and the accuracy cost on short
# conversational utterances is small.
beam_size = 1
vad_filter = true

[llm]
model = "qwen3:8b"
# Reasoning models write their thinking before answering, and none of it is
# spoken. On qwen3:8b that was 12.6 s against 0.45 s. See MEASUREMENTS.md.
think = false
# How long the model stays in VRAM after the last question. This is the
# graphics memory knob: while it is loaded, Talos holds about 7.4 GB of an
# 8 GB card and there is not much left for anything else.
#
# Longer means the assistant is always ready and the card is always busy.
# Shorter frees it sooner and costs about a minute the next time you speak.
# Ollama's own default is 5m; 30m suits an assistant you talk to in bursts.
#
# To free it immediately rather than waiting, say "let go of the GPU" — or run
# ollama stop qwen3:8b
keep_alive = "30m"
context = 4096
temperature = 0.7
# Runaway guard, not a style control. Reply length is the character
# definition's job — a cap tight enough to enforce brevity also truncates the
# answer when someone genuinely asked for detail, mid-sentence and without
# warning. This is only here to stop a model that has started looping.
max_tokens = 400
# Say something before running a skill. A skill call costs a full extra round
# trip through the model — measured at nine seconds against one for a plain
# answer — and that gap is structural, not something to optimise away. Silence
# that long sounds like a crash rather than like thinking.
acknowledge_skills = true

[skills]
enabled = true
# The directories skills may read. Anything outside is refused, including via
# symlinks or "..". This list is the assistant's entire reach — widen it
# carefully, and never to a whole drive or a home directory.
#
# Files that look like credentials are refused even inside these roots: giving
# an assistant a folder is not giving it the API keys that happen to sit in
# that folder, and this one reads its answers out loud.
workspaces = [
    "C:/Users/oguzo/OneDrive/Desktop/Mhendislik/Projects",
    "C:/Users/oguzo/OneDrive/Desktop/personnal_assistant",
]
# How many times the model may call a skill and be handed the result before it
# has to answer. Without a ceiling, a model that misreads a result will call
# the same skill forever.
max_rounds = 3

[todoist]
# Deliberately empty, and it should stay that way. Put the token in
# config/local.toml, which is git-ignored, or in the TODOIST_API_TOKEN
# environment variable — this file is committed, and a token in it would be
# pushed to GitHub the next time anyone runs git add.
token = ""

[tts]
engine = "piper"
# Which voice file in models/piper to use. A name fragment is enough. Empty
# picks whatever is there. Fetch more with:
#   run scripts\fetch_piper.py --language en/en_US --voice en_US-ryan-high
voice = "lessac"
# Set these from whichever preset sounded best in scripts/tune_tts.py.
# length_scale is the one that matters: below 1.0 is faster.
length_scale = 1.0
noise_w = 0.8
noise_scale = 0.667
sentence_silence = 0.15
